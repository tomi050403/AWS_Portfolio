AWSTemplateFormatVersion: '2010-09-09'
Description: "Flask-APP_sample Application stack"

Parameters:
  EnvironmentName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: Flask-APP-Product

  EC2AppImageID:
    Description: "Please enter ami for ec2."
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  EC2WebImageID:
    Description: "Please enter ami for ec2."
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  EC2Keypair:
    Description: "Enter the keypair to be used."
    Type: AWS::EC2::KeyPair::KeyName

Resources:
###EC2web
  EC2WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref EC2WebImageID
      InstanceType: t2.micro
      SubnetId: !ImportValue Flask-App-Network-Stack-PublicSubnet1
      SecurityGroupIds:
        - !ImportValue Flask-App-Security-Stack-EC2WEBSecurityGroup
      KeyName: !Ref EC2Keypair
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName} WebServer

###EC2APP
  EC2AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref EC2AppImageID
      InstanceType: t2.micro
      SubnetId: !ImportValue Flask-App-Network-Stack-PublicSubnet1
      SecurityGroupIds:
        - !ImportValue Flask-App-Security-Stack-EC2APPSecurityGroup
      KeyName: !Ref EC2Keypair
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName} AppServer

  APPHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: instance.privatelocal
      VPCs:
        - VPCId: !ImportValue Flask-App-Network-Stack-VPC
          VPCRegion: !ImportValue  Flask-App-Network-Stack-VPCRegion

  APPRecordSet:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref APPHostedZone
      Name: app.instance.privatelocal
      Type: A
      TTL: 60
      ResourceRecords:
        - !GetAtt EC2AppInstance.PrivateIpAddress

###ALB
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: Flask-APP-ALB
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue Flask-App-Network-Stack-PublicSubnet1
        - !ImportValue Flask-App-Network-Stack-PublicSubnet2
      SecurityGroups:
        - !ImportValue Flask-App-Security-Stack-ALBSecurityGroup
      IpAddressType: ipv4
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName} ALB

  ALBTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Flask-APP-ALB-TG
      VpcId: !ImportValue Flask-App-Network-Stack-VPC
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Port: 80
      TargetType: instance
      Targets:
        - Id: !Ref EC2WebInstance
          Port: 80
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName} ALBTG

  ALBListenerResource:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTG

Outputs:
  EC2WebInstance:
    Description: EC2 Instance Web Server
    Value: !Ref EC2WebInstance
    Export:
      Name: Flask-App-Application-Stack-EC2WebInstance

  EC2AppInstance:
    Description: EC2 Instance App Server
    Value: !Ref EC2AppInstance
    Export:
      Name: Flask-App-Application-Stack-EC2AppInstance

  ALB:
    Description: ALB
    Value: !Ref ALB
    Export:
      Name: Flask-App-Application-Stack-ALB
